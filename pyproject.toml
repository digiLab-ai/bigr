[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bigr"
version = "1.0.0"
description = "Tiny recursive models, think BIGR: guided stochastic exploration for frozen recursive models (code for the NeurIPS 2026 paper Boosting Inference with Guided Reasoning)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "NOTICES.md", "src/trm/UPSTREAM_LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Andrew Corbett", email = "andy.corbett@digilab.ai" },
  { name = "Anna Tzatzopoulou" },
  { name = "Archit Sood" },
  { name = "Sai-Aakash Ramesh" },
  { name = "Tim Dodwell" },
]
keywords = ["recursive reasoning", "particle filter", "sequential Monte Carlo", "TRM", "Sudoku", "test-time compute"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies for inference, figure regeneration and the evidence register.
# Pinned versions used for the paper are in requirements.txt.
dependencies = [
  "torch>=2.11,<3",
  "lightning>=2.5,<3",
  "numpy>=2.2",
  "pandas>=3.0",
  "scipy>=1.15",
  "matplotlib>=3.8",
  "tqdm>=4.67",
  "hydra-core>=1.3.2,<2",
  "hydra-colorlog>=1.2",
  "omegaconf>=2.3",
  "einops>=0.8",
  "rich>=14",
  "pydantic>=2.10",
  "pillow>=10",
  "click>=8",
  "huggingface-hub>=1.0",
]

[project.optional-dependencies]
# Training the TRM backbones with src/trm (Hydra + Lightning). W&B logging is optional.
train = ["wandb>=0.25", "adam-atan2>=0.0.3"]
dev = ["pytest>=8.4", "black>=25.1"]

[project.urls]
Homepage = "https://github.com/digiLab-ai/bigr"
Paper = "https://openreview.net/forum?id=nZD0FHMUmR"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bigr*", "trm*"]

[tool.setuptools.package-data]
trm = ["nn/configs/**/*.yaml", "UPSTREAM_LICENSE", "UPSTREAM_README.md", "TRM_INFO.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, isolated unit tests",
  "integration: tests that exercise multiple modules together",
]
filterwarnings = [
  "ignore::DeprecationWarning:torch",
]
