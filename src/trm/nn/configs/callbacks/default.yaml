defaults:
  - model_checkpoint
  # - early_stopping
  # - model_summary
  # - rich_progress_bar
  # - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/accuracy"
  mode: "max"
  save_top_k: 2
  save_last: true
  auto_insert_metric_name: false
  verbose: true
